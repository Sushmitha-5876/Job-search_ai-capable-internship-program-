<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     role="img"
     aria-label="AI Job Search Agent logo">

  <defs>

    <!-- Background -->
    <linearGradient id="bg"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#246BFF">
        <animate attributeName="stop-color"
                 values="#246BFF;#5146FF;#7B2CFF;#246BFF"
                 dur="6s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#7B2CFF">
        <animate attributeName="stop-color"
                 values="#7B2CFF;#3D4DFF;#9B35FF;#7B2CFF"
                 dur="6s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>


    <!-- Briefcase -->
    <linearGradient id="bag"
                    x1="0%" y1="0%"
                    x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#CBD7FF"/>
    </linearGradient>


    <!-- Clasp -->
    <linearGradient id="clasp"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4968FF"/>
      <stop offset="100%" stop-color="#8338FF"/>
    </linearGradient>


    <!-- Glow -->
    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="2.2"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- Strong glow -->
    <filter id="strongGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="4"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- Gloss -->
    <linearGradient id="shine"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">

      <stop offset="0%"
            stop-color="#FFFFFF"
            stop-opacity="0"/>

      <stop offset="45%"
            stop-color="#FFFFFF"
            stop-opacity="0"/>

      <stop offset="55%"
            stop-color="#FFFFFF"
            stop-opacity="0.75"/>

      <stop offset="65%"
            stop-color="#FFFFFF"
            stop-opacity="0"/>

      <stop offset="100%"
            stop-color="#FFFFFF"
            stop-opacity="0"/>

      <animate attributeName="x1"
               values="-100%;100%"
               dur="3.5s"
               repeatCount="indefinite"/>

      <animate attributeName="x2"
               values="0%;200%"
               dur="3.5s"
               repeatCount="indefinite"/>
    </linearGradient>

  </defs>


  <!-- ================================= -->
  <!-- APP BACKGROUND -->
  <!-- ================================= -->

  <rect x="4"
        y="4"
        width="56"
        height="56"
        rx="16"
        fill="url(#bg)"/>


  <!-- Outer glowing border -->

  <rect x="5"
        y="5"
        width="54"
        height="54"
        rx="15"
        fill="none"
        stroke="#8EA8FF"
        stroke-width="1"
        opacity="0.65">

    <animate attributeName="opacity"
             values="0.35;0.9;0.35"
             dur="2.8s"
             repeatCount="indefinite"/>

  </rect>


  <!-- ================================= -->
  <!-- FLOATING LIGHTS -->
  <!-- ================================= -->

  <circle cx="13"
          cy="18"
          r="1.2"
          fill="#FFFFFF"
          filter="url(#glow)">

    <animate attributeName="cy"
             values="18;15;18"
             dur="2.5s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0.3;1;0.3"
             dur="2.5s"
             repeatCount="indefinite"/>

  </circle>


  <circle cx="51"
          cy="16"
          r="1"
          fill="#BBD4FF"
          filter="url(#glow)">

    <animate attributeName="cy"
             values="16;19;16"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0.2;1;0.2"
             dur="3s"
             repeatCount="indefinite"/>

  </circle>


  <circle cx="50"
          cy="49"
          r="0.9"
          fill="#FFFFFF"
          filter="url(#glow)">

    <animate attributeName="opacity"
             values="0.2;0.9;0.2"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>


  <!-- ================================= -->
  <!-- BRIEFCASE AURA -->
  <!-- ================================= -->

  <rect x="11"
        y="21"
        width="42"
        height="30"
        rx="8"
        fill="none"
        stroke="#62A4FF"
        stroke-width="1.5"
        opacity="0.35"
        filter="url(#strongGlow)">

    <animate attributeName="opacity"
             values="0.15;0.65;0.15"
             dur="2.4s"
             repeatCount="indefinite"/>

    <animate attributeName="rx"
             values="8;10;8"
             dur="2.4s"
             repeatCount="indefinite"/>

  </rect>


  <!-- ================================= -->
  <!-- BRIEFCASE -->
  <!-- ================================= -->

  <g filter="url(#glow)">


    <!-- Handle -->

    <path d="M24 25
             V21.5
             C24 19.1 25.8 17.5 28.2 17.5
             H35.8
             C38.2 17.5 40 19.1 40 21.5
             V25"

          fill="none"
          stroke="#FFFFFF"
          stroke-width="3.8"
          stroke-linecap="round"/>


    <!-- Handle shine -->

    <path d="M27 22
             V21.5
             C27 20.4 27.8 19.7 29 19.7
             H35
             C36.2 19.7 37 20.4 37 21.5
             V22"

          fill="none"
          stroke="#FFFFFF"
          stroke-width="1"
          opacity="0.7"/>


    <!-- Main bag -->

    <rect x="13"
          y="23"
          width="38"
          height="26"
          rx="5.5"
          fill="url(#bag)"/>


    <!-- Top surface -->

    <path d="M18 25
             H46
             C47.8 25 49 26.3 49 28"

          fill="none"
          stroke="#FFFFFF"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.85"/>


    <!-- Middle divider -->

    <path d="M13.5 32
             H50.5"

          stroke="#B7C6FF"
          stroke-width="2"/>


    <!-- CENTER CLASP -->

    <rect x="27"
          y="29"
          width="10"
          height="7"
          rx="2.5"
          fill="url(#clasp)"/>


    <!-- Clasp highlight -->

    <path d="M29 31
             H35"

          stroke="#FFFFFF"
          stroke-width="1.4"
          stroke-linecap="round"
          opacity="0.9"/>


    <!-- Lower detail -->

    <path d="M20 40
             H44"

          stroke="#C2CEFF"
          stroke-width="1.5"
          stroke-linecap="round"/>


    <!-- Center AI dot -->

    <circle cx="32"
            cy="43"
            r="1.5"
            fill="#624FFF">

      <animate attributeName="r"
               values="1.2;2;1.2"
               dur="1.8s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="0.5;1;0.5"
               dur="1.8s"
               repeatCount="indefinite"/>

    </circle>


    <!-- ================================= -->
    <!-- MOVING GLASS REFLECTION -->
    <!-- ================================= -->

    <rect x="10"
          y="23"
          width="44"
          height="26"
          rx="6"
          fill="url(#shine)"
          opacity="0.55"/>

  </g>


  <!-- ================================= -->
  <!-- SMALL SPARKLES -->
  <!-- ================================= -->

  <g fill="#FFFFFF"
     filter="url(#glow)">

    <path d="M18 12
             L19 14
             L21 15
             L19 16
             L18 18
             L17 16
             L15 15
             L17 14 Z">

      <animate attributeName="opacity"
               values="0;1;0"
               dur="2.2s"
               repeatCount="indefinite"/>

    </path>


    <path d="M48 37
             L49 39
             L51 40
             L49 41
             L48 43
             L47 41
             L45 40
             L47 39 Z">

      <animate attributeName="opacity"
               values="0.1;0.9;0.1"
               dur="2.7s"
               repeatCount="indefinite"/>

    </path>

  </g>

</svg>